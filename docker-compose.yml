services:
  db:
    image: postgis/postgis:16-3.4
    container_name: dende-db
    environment:
      POSTGRES_USER: dende
      POSTGRES_PASSWORD: dende
      POSTGRES_DB: dende_registry
    ports:
      - "5432:5432"
    volumes:
      - dende_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dende -d dende_registry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dende_pgdata:
